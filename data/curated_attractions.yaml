# Attractions the planner may use, reviewed by hand against the Wikidata popularity ranking (November 2026).
# Only places on this list can enter a plan. It leaves out what the raw data wrongly offers: places that are closed
# (Centre Pompidou until 2030, Tour Montparnasse deck from April 2026, Palais de la Decouverte until March 2027),
# buildings you cannot enter (Elysee, National Assembly), duplicates of one site (Louvre Palace, Louvre Pyramid),
# mistagged entries (Foucault pendulum, herbarium), the arrondissements, and places whose hours could not be verified
# (Saint-Gervais). Every place here has real hours: from OSM, or from the web and written below. None are guessed.
#
# key       Wikidata id, or OSM id for places without one
# name      display name
# cat       category when the OSM tags give the wrong one
# duration  typical visit in minutes
# price     adult ticket in EUR. Where the 2026 rate differs, this is the higher non-EEA rate, so budgets stay safe
# source    web: checked on the web in November 2026, not on a contract with the site, so confirm before booking
#           free: no ticket needed
#           estimate: our estimate, not checked
# hours     OSM syntax, overrides the OSM tag. Used when the tag is missing or depends on sunset, checked on the web
#           in November 2026. Where sources disagree, this is the narrower window, so a plan is not sent to a closed door
# open_air  true: always accessible, no opening hours
# text      description, when Wikipedia and Wikidata offer nothing useful
# wheelchair overrides the OSM tag
# note      shown to travelers

